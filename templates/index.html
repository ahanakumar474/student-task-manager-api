<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task & Deadline Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --creamy: #EFECE6;
            --westhighland: #F5F2EB;
            --shoji: #E6DFD3;
            --radiant-dawn: #E4D7C5;
            --basket-beige: #B59A76;
            --habitat: #7A6E61;
            --hickory: #4E4137;
            --sable: #3E3229;
            --danger: #A64B3A;
            --danger-bg: #F3DFDA;
            --success: #5F735B;
            --success-bg: #E2E9E0;
        }

        * {
            box-sizing: border-box;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--creamy);
            color: var(--sable);
            max-width: 1060px;
            margin: 52px auto;
            padding: 0 28px 80px;
            font-size: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 36px;
        }

        h1 {
            font-family: 'Libre Baskerville', Georgia, serif;
            color: var(--hickory);
            font-size: 2.55rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--habitat);
            margin-top: 0;
            font-size: 1.08rem;
            letter-spacing: 0.2px;
        }

        /* 1. Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--westhighland);
            border: 1px solid var(--shoji);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(78, 65, 55, 0.05);
        }

        .stat-number {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--hickory);
        }

        .stat-label {
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--habitat);
            margin-top: 6px;
        }

        /* Input Form Card */
        .card {
            background: var(--westhighland);
            border: 1px solid var(--shoji);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(78, 65, 55, 0.06);
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2.2fr 1.3fr 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 760px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        input, select {
            background: #FAF8F5;
            color: var(--sable);
            padding: 14px 16px;
            border: 1px solid var(--radiant-dawn);
            border-radius: 10px;
            font-size: 15.5px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--basket-beige);
            box-shadow: 0 0 0 3px rgba(181, 154, 118, 0.18);
        }

        button.add-btn {
            background: var(--hickory);
            color: var(--westhighland);
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            grid-column: span 4;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        @media (max-width: 760px) {
            button.add-btn { grid-column: span 1; }
        }

        button.add-btn:hover {
            background: var(--sable);
        }

        /* 2. Search & Filter Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--shoji);
            color: var(--hickory);
            border: none;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--radiant-dawn);
        }

        .tab-btn.active {
            background: var(--basket-beige);
            color: #FFFFFF;
        }

        .search-box {
            min-width: 260px;
            flex-grow: 1;
            max-width: 340px;
        }

        /* Task Items */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--westhighland);
            border: 1px solid var(--shoji);
            border-left: 7px solid var(--basket-beige);
            padding: 22px 26px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 3px 10px rgba(78, 65, 55, 0.04);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(78, 65, 55, 0.08);
        }

        .task-item.completed {
            opacity: 0.68;
            border-left-color: var(--success);
            background: var(--shoji);
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--habitat);
        }

        .task-item.overdue {
            border-left-color: var(--danger);
            background: #FAF3F1;
        }

        .task-title {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-weight: 700;
            font-size: 18.5px;
            color: var(--hickory);
            margin-bottom: 8px;
        }

        .task-meta {
            font-size: 14.5px;
            color: var(--habitat);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .High { background: var(--danger-bg); color: var(--danger); }
        .Medium { background: var(--radiant-dawn); color: var(--hickory); }
        .Low { background: var(--success-bg); color: var(--success); }

        .overdue-tag {
            background: var(--danger);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            padding: 10px 18px;
            transition: opacity 0.2s;
        }

        .actions button:hover { opacity: 0.88; }
        .done-btn { background: var(--success); color: white; }
        .del-btn { background: var(--danger); color: white; }

        .empty-msg {
            text-align: center;
            color: var(--habitat);
            background: var(--westhighland);
            border: 1px dashed var(--basket-beige);
            border-radius: 14px;
            padding: 40px;
            font-size: 16px;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--hickory);
            color: var(--westhighland);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.25s ease;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>Student Task & Deadline Manager</h1>
        <p class="subtitle">Organize coursework, deadlines & priorities</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingCount">0</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-label">Completed</div>
        </div>
    </div>

    <!-- Add Task Form -->
    <div class="card">
        <form id="taskForm" class="form-grid">
            <input type="text" id="title" placeholder="Task title (e.g., Python Lab Viva)" required>
            <input type="text" id="subject" placeholder="Subject (e.g., CSDS)">
            <select id="priority">
                <option value="High">High Priority</option>
                <option
