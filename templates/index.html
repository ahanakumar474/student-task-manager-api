<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task & Deadline Manager</title>
    <style>
        :root {
            --creamy: #EFECE6;
            --westhighland: #F5F2EB;
            --shoji: #E6DFD3;
            --radiant-dawn: #E4D7C5;
            --basket-beige: #B59A76;
            --habitat: #7A6E61;
            --hickory: #4E4137;
            --sable: #3E3229;
            --danger: #A64B3A;
            --danger-bg: #F3DFDA;
            --success: #5F735B;
            --success-bg: #E2E9E0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--creamy);
            color: var(--sable);
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            color: var(--hickory);
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--habitat);
            margin-top: 0;
            font-size: 0.95rem;
        }

        /* 1. Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: var(--westhighland);
            border: 1px solid var(--shoji);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(78, 65, 55, 0.04);
        }

        .stat-number {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--hickory);
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--habitat);
            margin-top: 4px;
        }

        /* Input Form Card */
        .card {
            background: var(--westhighland);
            border: 1px solid var(--shoji);
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(78, 65, 55, 0.05);
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 680px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        input, select {
            background: #FAF8F5;
            color: var(--sable);
            padding: 11px 13px;
            border: 1px solid var(--radiant-dawn);
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--basket-beige);
        }

        button.add-btn {
            background: var(--hickory);
            color: var(--westhighland);
            border: none;
            border-radius: 9px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            grid-column: span 4;
            margin-top: 6px;
            transition: background 0.2s, transform 0.1s;
        }

        @media (max-width: 680px) {
            button.add-btn { grid-column: span 1; }
        }

        button.add-btn:hover {
            background: var(--sable);
        }

        /* 2. Search & Filter Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--shoji);
            color: var(--hickory);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--radiant-dawn);
        }

        .tab-btn.active {
            background: var(--basket-beige);
            color: #FFFFFF;
        }

        .search-box {
            min-width: 220px;
            flex-grow: 1;
            max-width: 280px;
        }

        /* Task Items */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--westhighland);
            border: 1px solid var(--shoji);
            border-left: 6px solid var(--basket-beige);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(78, 65, 55, 0.04);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .task-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(78, 65, 55, 0.08);
        }

        .task-item.completed {
            opacity: 0.68;
            border-left-color: var(--success);
            background: var(--shoji);
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--habitat);
        }

        .task-item.overdue {
            border-left-color: var(--danger);
            background: #FAF3F1;
        }

        .task-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--hickory);
            margin-bottom: 6px;
        }

        .task-meta {
            font-size: 13px;
            color: var(--habitat);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .High { background: var(--danger-bg); color: var(--danger); }
        .Medium { background: var(--radiant-dawn); color: var(--hickory); }
        .Low { background: var(--success-bg); color: var(--success); }

        .overdue-tag {
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 13px;
            transition: opacity 0.2s;
        }

        .actions button:hover { opacity: 0.88; }
        .done-btn { background: var(--success); color: white; }
        .del-btn { background: var(--danger); color: white; }

        .empty-msg {
            text-align: center;
            color: var(--habitat);
            background: var(--westhighland);
            border: 1px dashed var(--basket-beige);
            border-radius: 12px;
            padding: 30px;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--hickory);
            color: var(--westhighland);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.25s ease;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>Student Task & Deadline Manager</h1>
        <p class="subtitle">Organize coursework, deadlines & priorities</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingCount">0</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-label">Completed</div>
        </div>
    </div>

    <!-- Add Task Form -->
    <div class="card">
        <form id="taskForm" class="form-grid">
            <input type="text" id="title" placeholder="Task title (e.g., Python Lab Viva)" required>
            <input type="text" id="subject" placeholder="Subject (e.g., CSDS)">
            <select id="priority">
                <option value="High">High Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>
            <input type="date" id="due_date">
            <button type="submit" class="add-btn">+ Add Task</button>
        </form>
    </div>

    <!-- Filter & Search Controls -->
    <div class="controls">
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
            <button class="tab-btn" onclick="setFilter('pending', this)">Pending</button>
            <button class="tab-btn" onclick="setFilter('completed', this)">Completed</button>
            <button class="tab-btn" onclick="setFilter('high', this)">High Priority</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Search by title or subject..." oninput="renderTasks()">
    </div>

    <!-- Task List -->
    <div id="taskList"></div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        const API_URL = "/tasks";
        let allTasks = [];
        let currentFilter = "all";

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        function setFilter(filter, btnElement) {
            currentFilter = filter;
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            btnElement.classList.add("active");
            renderTasks();
        }

        function isOverdue(dueDate, completed) {
            if (!dueDate || completed) return false;
            const today = new Date().toISOString().split("T")[0];
            return dueDate < today;
        }

        function updateStats() {
            const total = allTasks.length;
            const completed = allTasks.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById("totalCount").textContent = total;
            document.getElementById("completedCount").textContent = completed;
            document.getElementById("pendingCount").textContent = pending;
        }

        function renderTasks() {
            const searchQuery = document.getElementById("searchInput").value.toLowerCase();
            const listDiv = document.getElementById("taskList");
            listDiv.innerHTML = "";

            const filtered = allTasks.filter(task => {
                const matchesSearch =
                    task.title.toLowerCase().includes(searchQuery) ||
                    task.subject.toLowerCase().includes(searchQuery);

                if (!matchesSearch) return false;
                if (currentFilter === "pending") return !task.completed;
                if (currentFilter === "completed") return task.completed;
                if (currentFilter === "high") return task.priority === "High";
                return true;
            });

            if (filtered.length === 0) {
                listDiv.innerHTML = '<div class="empty-msg">No matching tasks found.</div>';
                return;
            }

            filtered.forEach(task => {
                const overdue = isOverdue(task.due_date, task.completed);
                const div = document.createElement("div");
                div.className = `task-item ${task.completed ? "completed" : ""} ${overdue ? "overdue" : ""}`;

                div.innerHTML = `
                    <div>
                        <div class="task-title">${task.title}</div>
                        <div class="task-meta">
                            <span class="badge ${task.priority}">${task.priority}</span>
                            <strong>${task.subject}</strong>
                            ${task.due_date ? `<span>• Due: ${task.due_date}</span>` : ""}
                            ${overdue ? `<span class="overdue-tag">Overdue</span>` : ""}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="done-btn" onclick="toggleTask('${task.id}')">
                            ${task.completed ? "Undo" : "Done"}
                        </button>
                        <button class="del-btn" onclick="deleteTask('${task.id}')">Delete</button>
                    </div>
                `;
                listDiv.appendChild(div);
            });
        }

        async function fetchTasks() {
            const response = await fetch(API_URL);
            allTasks = await response.json();
            updateStats();
            renderTasks();
        }

        document.getElementById("taskForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById("title").value,
                subject: document.getElementById("subject").value || "General",
                priority: document.getElementById("priority").value,
                due_date: document.getElementById("due_date").value
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById("taskForm").reset();
                showToast("Task added!");
                fetchTasks();
            } else {
                const err = await response.json();
                showToast(err.error || "Failed to add task");
            }
        });

        async function toggleTask(id) {
            await fetch(`${API_URL}/${id}`, { method: "PUT" });
            showToast("Task status updated");
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            showToast("Task deleted");
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
